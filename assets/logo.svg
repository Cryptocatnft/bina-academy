<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="BINA logo — the letter Bet built from neural traces with a spark inside">
  <defs>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- the letter Bet: three traces + foot -->
  <g stroke="url(#trace)" stroke-width="112" stroke-linecap="round" fill="none">
    <line x1="250" y1="260" x2="770" y2="260"/>
    <line x1="770" y1="260" x2="770" y2="800"/>
    <line x1="770" y1="800" x2="250" y2="800"/>
    <line x1="250" y1="800" x2="250" y2="920"/>
  </g>
  <!-- nodes -->
  <g fill="url(#trace)">
    <circle cx="250" cy="260" r="78"/>
    <circle cx="770" cy="260" r="78"/>
    <circle cx="770" cy="800" r="78"/>
    <circle cx="250" cy="800" r="78"/>
    <circle cx="250" cy="920" r="78"/>
  </g>
  <!-- the spark: the learner -->
  <circle cx="490" cy="545" r="198" fill="url(#glow)"/>
  <line x1="490" y1="611" x2="490" y2="740" stroke="#2dd4bf" stroke-width="18" stroke-linecap="round" opacity="0.85"/>
  <circle cx="490" cy="545" r="66" fill="#ffffff"/>
</svg>
